<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- Карантин: крест краской из баллончика на зелёной двери — напыление вокруг, неровные мазки, подтёки -->
<defs><linearGradient id="door" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a5c46"/><stop offset="1" stop-color="#2b3829"/></linearGradient>
<filter id="spray" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="22"/></filter>
<filter id="haze"><feGaussianBlur stdDeviation="10"/></filter></defs>
<rect width="512" height="512" fill="url(#door)"/>
<g stroke="#000" stroke-opacity=".18" stroke-width="4"><path d="M128 0V512M256 0V512M384 0V512"/></g>
<g stroke="#c4170f" stroke-opacity=".35" stroke-width="86" stroke-linecap="round" fill="none" filter="url(#haze)"><path d="M146 142 Q260 250 368 360"/><path d="M366 132 Q254 262 146 372"/></g>
<g stroke="#c4170f" stroke-width="50" stroke-linecap="round" fill="none" filter="url(#spray)"><path d="M146 142 Q260 250 368 360"/><path d="M366 132 Q254 262 146 372"/></g>
<g fill="#c4170f">
  <rect x="150" y="366" width="12" height="76" rx="6"/><circle cx="156" cy="444" r="9"/>
  <rect x="356" y="364" width="10" height="44" rx="5"/><circle cx="361" cy="410" r="7"/>
  <rect x="244" y="276" width="11" height="128" rx="5.5"/><circle cx="249.5" cy="406" r="8"/>
